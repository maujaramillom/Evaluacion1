server:
  port: 8081

spring:
  application:
    name: vehiculos-service

  datasource:
    url: jdbc:mysql://localhost:3306/sigefi_vehiculos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    cl.duoc.sigefi.vehiculos: DEBUG
    org.springframework.cloud.openfeign: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
